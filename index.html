<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Peyser's Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    :root { --ease-apple: cubic-bezier(0.22, 1, 0.36, 1); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "PingFang SC", sans-serif;
      background-color: #000000;
      color: #f5f5f7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: "SF Mono", "JetBrains Mono", monospace; }
    .hero-title {
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .apple-card-interactive {
      background: rgba(28, 28, 30, 0.68);
      backdrop-filter: blur(24px) saturate(150%);
      transition: transform 0.35s var(--ease-apple), background-color 0.3s var(--ease-apple);
    }
    .apple-card-interactive:hover {
      background: rgba(44, 44, 46, 0.78);
      transform: translateY(-2px);
    }
    .route-view { display: none; }
    .route-view.active { display: block; }
  </style>
</head>
<body class="selection:bg-white/20">

  <!-- 1. 主页视图 (app.peyser.cn) -->
  <main id="view-home" class="route-view active max-w-4xl mx-auto px-5 sm:px-8 pt-12 sm:pt-20 pb-24">
    <header class="mb-12 sm:mb-16">
      <div class="text-xs mono text-zinc-500 mb-3">app.peyser.cn</div>
      <h1 class="hero-title text-5xl sm:text-7xl">Peyser's Studio</h1>
      <p class="text-base sm:text-xl text-zinc-400 mt-3 tracking-tight">Personal Workspace &amp; Field Notes</p>
    </header>

    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <button
        type="button"
        onclick="switchRoute('/travel')"
        class="apple-card-interactive rounded-3xl p-6 sm:p-7 text-left flex flex-col justify-between min-h-[168px] cursor-pointer group"
      >
        <div class="flex items-center justify-between w-full">
          <span class="text-xs font-medium uppercase tracking-widest text-zinc-400">Module 01</span>
          <span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-zinc-200 group-hover:translate-x-0.5 transition-transform">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
          </span>
        </div>
        <div class="mt-8">
          <h2 class="text-2xl font-semibold text-white tracking-tight">旅行 · Travel</h2>
          <p class="text-xs sm:text-sm text-zinc-400 mt-1">路书归档、城市动线与实时地图</p>
        </div>
      </button>

      <a
        href="https://peyser.cn"
        class="apple-card-interactive rounded-3xl p-6 sm:p-7 text-left flex flex-col justify-between min-h-[168px] group"
      >
        <div class="flex items-center justify-between w-full">
          <span class="text-xs font-medium uppercase tracking-widest text-zinc-500">Portal</span>
          <span class="w-8 h-8 rounded-full bg-white/[0.06] flex items-center justify-center text-zinc-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" /></svg>
          </span>
        </div>
        <div class="mt-8">
          <h2 class="text-2xl font-semibold text-zinc-200 tracking-tight">peyser.cn</h2>
          <p class="text-xs sm:text-sm text-zinc-500 mt-1">返回 Peyser's Studio 主站</p>
        </div>
      </a>
    </section>
  </main>

  <!-- 2. 旅行归档视图 (app.peyser.cn/travel) -->
  <main id="view-travel" class="route-view max-w-4xl mx-auto px-5 sm:px-8 pt-10 sm:pt-16 pb-24">
    <nav class="mb-8">
      <button
        type="button"
        onclick="switchRoute('/')"
        class="inline-flex items-center gap-1.5 text-xs sm:text-sm text-zinc-400 hover:text-white transition py-1 -ml-1 cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
        Peyser's Studio
      </button>
    </nav>

    <header class="mb-10">
      <h1 class="hero-title text-4xl sm:text-6xl">Travel</h1>
      <p class="text-base sm:text-lg text-zinc-400 mt-2 tracking-tight">Peyser's Studio · 行程与探索归档</p>
    </header>

    <section class="space-y-4">
      <!-- 点击跳转到独立的比利时路书单页 -->
      <a
        href="./travel/202611/"
        class="apple-card-interactive w-full rounded-3xl p-6 sm:p-8 text-left flex items-center justify-between gap-4 cursor-pointer group"
      >
        <div class="min-w-0">
          <div class="flex items-center gap-2.5 mb-2">
            <span class="mono text-xs px-2.5 py-0.5 rounded-full bg-white/10 text-zinc-200">2026.11</span>
            <span class="text-xs text-zinc-500">Belgium · 5 Cities</span>
          </div>
          <h2 class="text-2xl sm:text-3xl font-semibold text-white tracking-tight">2026年11月 · 比利时</h2>
          <p class="text-xs sm:text-sm text-zinc-400 mt-1.5 truncate">Antwerpen · Brugge · Bruxelles · Gent · Oostende</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
        </div>
      </a>
    </section>
  </main>

  <script>
    function switchRoute(path) {
      history.pushState({ path }, "", path);
      render();
    }

    function render() {
      const p = window.location.pathname;
      const home = document.getElementById("view-home");
      const travel = document.getElementById("view-travel");
      
      if (p.includes("/travel")) {
        home.classList.remove("active");
        travel.classList.add("active");
        document.title = "Travel · Peyser's Studio";
      } else {
        travel.classList.remove("active");
        home.classList.add("active");
        document.title = "Peyser's Studio";
      }
    }

    window.addEventListener("popstate", render);
    render();
  </script>
</body>
</html>
