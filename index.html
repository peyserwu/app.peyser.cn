<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Peyser's Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --ease-apple: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.36, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: #000000;
      color: #f5f5f7;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: "SF Mono", "JetBrains Mono", monospace;
    }

    .hero-title {
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 苹果风格卡片与弹性方块动画 */
    .apple-card-interactive {
      background: rgba(28, 28, 30, 0.68);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      transition: transform 0.4s var(--ease-spring), background-color 0.3s var(--ease-apple), box-shadow 0.3s var(--ease-apple);
    }

    .apple-card-interactive:hover {
      background: rgba(44, 44, 46, 0.82);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .apple-card-interactive:active {
      transform: scale(0.985);
    }

    /* 路由视图渐显加载动画 */
    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.995);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .route-view {
      display: none;
      opacity: 0;
    }

    .route-view.active {
      display: block;
      animation: viewFadeIn 0.45s var(--ease-apple) forwards;
    }

    /* 模块加载遮罩（模拟APP级平滑过渡） */
    #appLoader {
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
  </style>
</head>
<body class="selection:bg-white/20">

  <!-- 模拟 APP 启动加载层 -->
  <div id="appLoader" class="fixed inset-0 z-50 bg-black flex items-center justify-center pointer-events-none opacity-0">
    <div class="w-6 h-6 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
  </div>

  <!-- 1. 主页视图 (app.peyser.cn) -->
  <main id="view-home" class="route-view max-w-4xl mx-auto px-5 sm:px-8 pt-6 sm:pt-10 pb-24">
    <!-- 调整后的顶部：Peyser's Studio 提行，下方带有一个 APP 框 -->
    <header class="flex flex-col items-start gap-2.5 pt-2 mb-12 sm:mb-16">
      <div class="text-xl sm:text-2xl font-bold tracking-tight text-white">Peyser's Studio</div>
      <div class="px-2.5 py-1 rounded-md bg-[#1c1c1e] border border-white/10 text-zinc-300 text-xs font-mono tracking-wider">
        APP
      </div>
    </header>

    <div class="mb-8">
      <div class="text-xs mono text-zinc-500 mb-2">app.peyser.cn · Workspace</div>
      <h1 class="hero-title text-4xl sm:text-6xl">Dashboard</h1>
      <p class="text-sm sm:text-base text-zinc-400 mt-2 tracking-tight">Personal Workspace &amp; Field Notes</p>
    </div>

    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- 带有弹性动画与加载反馈的模块卡片（点击跳转到 /travel） -->
      <button
        type="button"
        onclick="switchRoute('/travel')"
        class="apple-card-interactive rounded-3xl p-6 sm:p-7 text-left flex flex-col justify-between min-h-[168px] cursor-pointer group"
      >
        <div class="flex items-center justify-between w-full">
          <span class="text-xs font-medium uppercase tracking-widest text-zinc-400">Module 01</span>
          <span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-zinc-200 group-hover:translate-x-1 transition-transform duration-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
          </span>
        </div>
        <div class="mt-8">
          <h2 class="text-2xl font-semibold text-white tracking-tight">旅行 · Travel</h2>
          <p class="text-xs sm:text-sm text-zinc-400 mt-1">路书归档、城市动线与实时地图</p>
        </div>
      </button>
    </section>
  </main>

  <!-- 2. 旅行归档视图 (app.peyser.cn/travel) -->
  <main id="view-travel" class="route-view max-w-4xl mx-auto px-5 sm:px-8 pt-6 sm:pt-10 pb-24">
    <!-- 旅行页面的顶部：同样保留 Peyser's Studio 提行 + 带有返回工作台的 APP 框 -->
    <header class="flex flex-col items-start gap-2.5 pt-2 mb-10">
      <div class="text-xl sm:text-2xl font-bold tracking-tight text-white">Peyser's Studio</div>
      <button
        type="button"
        onclick="switchRoute('/')"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#1c1c1e] hover:bg-[#2c2c2e] text-zinc-300 text-xs font-medium transition cursor-pointer"
      >
        <span>← 返回工作台首页</span>
      </button>
    </header>

    <div class="mb-10">
      <h1 class="hero-title text-4xl sm:text-6xl">Travel</h1>
      <p class="text-base sm:text-lg text-zinc-400 mt-2 tracking-tight">Peyser's Studio · 行程与探索归档</p>
    </div>

    <section class="space-y-4">
      <!-- 点击跳转到独立的比利时路书单页 -->
      <a
        href="./travel/202611/"
        class="apple-card-interactive w-full rounded-3xl p-6 sm:p-8 text-left flex items-center justify-between gap-4 cursor-pointer group"
      >
        <div class="min-w-0">
          <div class="flex items-center gap-2.5 mb-2">
            <span class="mono text-xs px-2.5 py-0.5 rounded-full bg-white/10 text-zinc-200">2026.11</span>
            <span class="text-xs text-zinc-500">Belgium · 5 Cities</span>
          </div>
          <h2 class="text-2xl sm:text-3xl font-semibold text-white tracking-tight">2026年11月 · 比利时</h2>
          <p class="text-xs sm:text-sm text-zinc-400 mt-1.5 truncate">Antwerpen · Brugge · Bruxelles · Gent · Oostende</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
        </div>
      </a>
    </section>
  </main>

  <script>
    // 模拟APP级的丝滑路由切换与加载反馈
    function switchRoute(path) {
      const loader = document.getElementById("appLoader");
      loader.classList.remove("opacity-0");
      
      setTimeout(() => {
        history.pushState({ path }, "", path);
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
        
        setTimeout(() => {
          loader.classList.add("opacity-0");
        }, 120);
      }, 180);
    }

    function render() {
      const p = window.location.pathname;
      const home = document.getElementById("view-home");
      const travel = document.getElementById("view-travel");
      
      if (p.includes("/travel")) {
        home.classList.remove("active");
        travel.classList.add("active");
        document.title = "Travel · Peyser's Studio";
      } else {
        travel.classList.remove("active");
        home.classList.add("active");
        document.title = "Peyser's Studio";
      }
    }

    window.addEventListener("popstate", () => {
      const loader = document.getElementById("appLoader");
      loader.classList.remove("opacity-0");
      setTimeout(() => {
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
        setTimeout(() => loader.classList.add("opacity-0"), 100);
      }, 150);
    });

    render();
  </script>
</body>
</html>
