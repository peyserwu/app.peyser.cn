<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>Peyser's Studio</title>
  <style>
    body { background: #000000; margin: 0; }
  </style>
  <script>
    (function () {
      var target = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem("peyser_spa_redirect", target);
      window.location.replace("/");
    })();
  </script>
</head>
<body>

</html>
