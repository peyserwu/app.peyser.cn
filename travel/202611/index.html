    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --ease-apple: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.36, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: #000000;
      color: #f5f5f7;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: "SF Mono", "JetBrains Mono", monospace;
    }

    .hero-title {
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .apple-surface {
      background: rgba(28, 28, 30, 0.65);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
    }

    .hairline-b {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 窄屏横向滚动渐隐遮罩 */
    .city-scroll-mask {
      position: relative;
    }
    .city-scroll-mask::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 28px;
      background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.92));
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .city-scroll-mask.at-end::after {
      opacity: 0;
    }

    /* 左右滑动容器 */
    .swipe-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .swipe-slide {
      flex: 0 0 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    /* Apple Segmented Control */
    .segmented-wrap {
      position: relative;
      background: rgba(28, 28, 30, 0.85);
      border-radius: 14px;
      padding: 3px;
    }
    .segmented-pill {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc((100% - 6px) / 3);
      background: rgba(255, 255, 255, 0.14);
      border-radius: 11px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.38s var(--ease-apple);
      pointer-events: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-in {
      animation: fadeUp 0.55s var(--ease-apple) both;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake {
      animation: shake 0.35s var(--ease-apple);
    }

    .row-item {
      transition: background-color 0.25s var(--ease-apple), transform 0.2s var(--ease-apple), opacity 0.25s ease;
    }
    .row-item:active {
      transform: scale(0.985);
    }

    .check-circle {
      transition: all 0.28s var(--ease-spring);
    }

    .map-invert {
      filter: invert(92%) hue-rotate(180deg) contrast(94%) saturate(85%);
    }

</head>

    const weatherCache = {};
    function codeToLabel(code) {
      if (code === 0) return "晴";
      if (code <= 3) return "多云";
      if (code <= 48) return "雾";
      if (code <= 67) return "小雨";
      if (code <= 77) return "雨雪";
      if (code <= 82) return "阵雨";
      return "雷雨";
    }

    async function loadWeather(city) {
      const tempEl = document.getElementById("currentTemp");
      const metaEl = document.getElementById("currentMeta");
      const rowEl = document.getElementById("forecastRow");

      if (!weatherCache[city.id]) {
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBrussels&forecast_days=5`;
          const res = await fetch(url);
          if (!res.ok) throw new Error();
          weatherCache[city.id] = await res.json();
        } catch {
          weatherCache[city.id] = null;
        }
      }

      const data = weatherCache[city.id];
      if (!data || !data.current) {
        tempEl.textContent = "--°";
        metaEl.textContent = "气象离线";
        rowEl.innerHTML = `<div class="col-span-5 text-xs text-zinc-500 py-1">暂无预报数据</div>`;
        return;
      }

      const cur = data.current;
      tempEl.textContent = `${Math.round(cur.temperature_2m)}°`;
      metaEl.textContent = `${codeToLabel(cur.weather_code)} · 体感 ${Math.round(cur.apparent_temperature)}° · ${Math.round(cur.wind_speed_10m)}km/h`;

      rowEl.innerHTML = "";
      data.daily.time.forEach((dateStr, i) => {
        const d = new Date(dateStr + "T12:00:00");
        const dayName = i === 0 ? "今天" : new Intl.DateTimeFormat("zh-CN", { weekday: "short" }).format(d);
        const minT = Math.round(data.daily.temperature_2m_min[i]);
        const maxT = Math.round(data.daily.temperature_2m_max[i]);
        const pop = data.daily.precipitation_probability_max[i];

        const cell = document.createElement("div");
        cell.className = "py-1.5";
        cell.innerHTML = `
          <div class="text-[11px] text-zinc-500">${dayName}</div>
          <div class="text-xs font-medium text-zinc-200 my-1">${codeToLabel(data.daily.weather_code[i])}</div>
          <div class="mono text-xs text-zinc-200">${minT}°/${maxT}°</div>
          <div class="mono text-[10px] text-zinc-500 mt-0.5">${pop}%</div>
        `;
        rowEl.appendChild(cell);
      });
    }

          el.innerHTML = `
            <div class="flex items-baseline justify-between gap-2">
              <span class="text-xs sm:text-sm font-medium text-zinc-100">${item.shop}</span>
              <span class="mono text-xs text-zinc-400 shrink-0">${item.price}</span>
            </div>
            <div class="text-xs font-medium text-zinc-300 mt-1">${item.type}</div>
            <div class="text-xs text-zinc-500 mt-0.5 leading-relaxed">${item.note}</div>
          `;
          el.addEventListener("click", () => {
            focusSinglePlace(`${item.shop} · ${item.type}`, `${city.localName} · ${item.price}`, item.query);
            if (window.innerWidth < 1024) {
              document.getElementById("gmapFrame").scrollIntoView({ behavior: "smooth", block: "center" });
            }
          });
          box.appendChild(el);
        });
      }

      renderFoodGroup("snackList", city.snacks);
      renderFoodGroup("dinnerList", city.dinners);

      // 切换城市时默认显示该城市所有景点的标注
      showCityAllSpotsOnMap(city);
    }

    function renderPackingList() {
      const container = document.getElementById("packingList");
      container.innerHTML = "";
      const doneCount = PACKING_ITEMS.filter(item => packDone[item.id]).length;
      document.getElementById("packProgress").textContent = `${doneCount}/${PACKING_ITEMS.length}`;

      PACKING_ITEMS.forEach((item) => {
        const checked = !!packDone[item.id];
        const row = document.createElement("label");
        row.className = "row-item flex items-center gap-3 py-2.5 px-2 -mx-2 rounded-xl hover:bg-white/[0.04] cursor-pointer select-none";
        row.innerHTML = `
          <input type="checkbox" ${checked ? "checked" : ""} class="accent-white rounded cursor-pointer" />
          <span class="text-xs sm:text-sm ${checked ? "line-through text-zinc-600" : "text-zinc-200"}">${item.text}</span>
        `;
        row.querySelector("input").addEventListener("change", (e) => {
          packDone[item.id] = e.target.checked;
          localStorage.setItem(STORAGE_PACK_KEY, JSON.stringify(packDone));
          renderPackingList();
        });
        container.appendChild(row);
      });
    }

    function renderAll() {
      renderCityView();
      renderPackingList();
    }

    if (sessionStorage.getItem(STORAGE_AUTH_KEY) === "1") {
      renderAll();
    }
  </script>
</body>
</html>
